<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1a45" />
  <title>Kalkulator Sederhana</title>
  <link rel="icon" href="assets/pixel/karakter/kelinci_idle.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="no-transition">
  <!-- ===== latar hutan pixel (suasana mengikuti jam) ===== -->
  <div class="forest" aria-hidden="true">
    <div class="sky sky-pagi"></div>
    <div class="sky sky-siang"></div>
    <div class="sky sky-sore"></div>
    <div class="sky sky-malam"></div>
    <div class="sky sky-larut"></div>

    <div class="stars"></div>

    <!-- burung (pagi–sore), 2 frame kepak -->
    <div class="birds">
      <div class="bird bird1 flip2"><img src="assets/pixel/hewan/burung_1.png" alt=""><img src="assets/pixel/hewan/burung_2.png" alt=""></div>
      <div class="bird bird2 flip2"><img src="assets/pixel/hewan/burung_1.png" alt=""><img src="assets/pixel/hewan/burung_2.png" alt=""></div>
      <div class="bird bird3 flip2"><img src="assets/pixel/hewan/burung_1.png" alt=""><img src="assets/pixel/hewan/burung_2.png" alt=""></div>
    </div>

    <!-- hewan yang lewat -->
    <div class="walker deer flip2"><img src="assets/pixel/hewan/rusa_1.png" alt=""><img src="assets/pixel/hewan/rusa_2.png" alt=""></div>
    <div class="walker fox flip2"><img src="assets/pixel/hewan/rubah_1.png" alt=""><img src="assets/pixel/hewan/rubah_2.png" alt=""></div>
    <div class="walker bunny">
      <img src="assets/pixel/hewan/kelinci_jalan_kiri_1.png" alt="">
      <img src="assets/pixel/hewan/kelinci_jalan_kiri_2.png" alt="">
      <img src="assets/pixel/hewan/kelinci_jalan_kiri_3.png" alt="">
      <img src="assets/pixel/hewan/kelinci_jalan_kiri_4.png" alt="">
    </div>

    <!-- hewan tambahan -->
    <div class="walker squirrel flip2"><img src="assets/pixel/hewan/tupai_1.png" alt=""><img src="assets/pixel/hewan/tupai_2.png" alt=""></div>
    <div class="walker hedgehog flip2 face-left"><img src="assets/pixel/hewan/landak_1.png" alt=""><img src="assets/pixel/hewan/landak_2.png" alt=""></div>
    <div class="walker snail flip2"><img src="assets/pixel/hewan/siput_1.png" alt=""><img src="assets/pixel/hewan/siput_2.png" alt=""></div>
    <div class="frog"><img class="fr1" src="assets/pixel/hewan/katak_1.png" alt=""><img class="fr2" src="assets/pixel/hewan/katak_2.png" alt=""></div>
    <div class="flyer butterfly bf1 flip2"><img src="assets/pixel/hewan/kupu_pink_1.png" alt=""><img src="assets/pixel/hewan/kupu_pink_2.png" alt=""></div>
    <div class="flyer butterfly bf2 flip2"><img src="assets/pixel/hewan/kupu_biru_1.png" alt=""><img src="assets/pixel/hewan/kupu_biru_2.png" alt=""></div>
    <div class="flyer bat bat1 flip2"><img src="assets/pixel/hewan/kelelawar_1.png" alt=""><img src="assets/pixel/hewan/kelelawar_2.png" alt=""></div>
    <div class="flyer bat bat2 flip2"><img src="assets/pixel/hewan/kelelawar_1.png" alt=""><img src="assets/pixel/hewan/kelelawar_2.png" alt=""></div>

    <!-- dekorasi depan (warnanya mengikuti waktu, diatur di CSS) -->
    <div class="deco d-tunggul"></div>
    <div class="deco d-batu"></div>
    <div class="deco d-jamur"></div>
    <div class="deco d-papan"></div>
    <div class="deco d-semak"></div>
    <div class="deco d-semak2"></div>
    <div class="deco d-pohon t1">
      <!-- burung hantu bertengger (malam) -->
      <div class="owl"><img class="ow1" src="assets/pixel/hewan/burung_hantu_1.png" alt=""><img class="ow2" src="assets/pixel/hewan/burung_hantu_2.png" alt=""><img class="ow3" src="assets/pixel/hewan/burung_hantu_3.png" alt=""></div>
    </div>
    <div class="deco d-pohon t2"></div>

    <div class="fireflies"></div>
    <div class="leaves"></div>
    <div class="tint"></div>
  </div>

  <!-- lapisan efek: konfeti, ikon jawaban & error -->
  <div class="fx" aria-hidden="true"></div>

  <main class="calculator">
    <!-- maskot kelinci yang bereaksi (pose dipilih oleh script.js) -->
    <div class="mascot" id="mascot" data-state="idle" aria-hidden="true">
      <div class="bubble" id="bubble"></div>
      <div class="m-body">
        <img data-pose="idle" src="assets/pixel/karakter/kelinci_idle.png" alt="">
        <img data-pose="menyapa" src="assets/pixel/karakter/kelinci_menyapa.png" alt="">
        <img data-pose="membaca" src="assets/pixel/karakter/kelinci_membaca.png" alt="">
        <img data-pose="duduk" src="assets/pixel/karakter/kelinci_duduk.png" alt="">
        <img data-pose="duduk_kedip" src="assets/pixel/karakter/kelinci_duduk_kedip.png" alt="">
        <img data-pose="tidur" src="assets/pixel/karakter/kelinci_tidur.png" alt="">
        <img data-pose="siap" src="assets/pixel/karakter/kelinci_siap.png" alt="">
        <img data-pose="berpikir" src="assets/pixel/karakter/kelinci_berpikir.png" alt="">
        <img data-pose="thumbs_up" src="assets/pixel/karakter/kelinci_thumbs_up.png" alt="">
        <img data-pose="senang" src="assets/pixel/karakter/kelinci_senang.png" alt="">
        <img data-pose="lompat" src="assets/pixel/karakter/kelinci_lompat.png" alt="">
        <img data-pose="bingung" src="assets/pixel/karakter/kelinci_bingung.png" alt="">
        <img data-pose="sedih" src="assets/pixel/karakter/kelinci_sedih.png" alt="">
        <img data-pose="menyemangati" src="assets/pixel/karakter/kelinci_menyemangati.png" alt="">
        <img data-pose="kejutan" src="assets/pixel/karakter/kelinci_kejutan.png" alt="">
      </div>
    </div>

    <header class="top">
      <img class="logo" src="assets/pixel/dekorasi/pohon_siang.png" alt="" aria-hidden="true">
      <h1>Kalkulator Sederhana</h1>
    </header>

    <div class="toolbar">
      <span class="box period-badge" title="Suasana mengikuti jam perangkat">
        <img id="periodIcon" src="assets/pixel/item/ikon_malam.png" alt="">
        <span id="periodLabel" class="sr-only">Malam</span>
        <time id="clock">--.--</time>
      </span>
      <span class="box streak" id="streak" title="Hitungan berhasil berturut-turut"><img src="assets/pixel/item/bintang.png" alt=""> <b>0</b></span>
      <div class="box sound-ctrl">
        <button type="button" id="muteBtn" class="icon-btn" aria-pressed="false" aria-label="Matikan suara" title="Suara (M)">
          <img class="ic-on" src="assets/pixel/ui/ikon_suara_nyala.png" alt="">
          <img class="ic-off" src="assets/pixel/ui/ikon_suara_mati.png" alt="">
        </button>
        <input type="range" id="volume" min="0" max="100" value="60" aria-label="Volume suara">
      </div>
    </div>

    <div class="display">
      <img class="glare" src="assets/pixel/ui/kilap_lcd.png" alt="" aria-hidden="true">
      <input type="text" id="expression" placeholder="0" readonly inputmode="none" tabindex="-1" aria-label="Ekspresi" />
      <div id="result" aria-live="polite">0</div>
    </div>

    <div class="buttons">
      <button data-action="clear" class="fn clear">C</button>
      <button data-action="back" class="fn del" aria-label="Hapus satu">DEL</button>
      <button data-value="%" class="fn">%</button>
      <button data-value="/" class="op" aria-label="Bagi">÷</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button data-value="*" class="op" aria-label="Kali">×</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button data-value="-" class="op" aria-label="Kurang">−</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button data-value="+" class="op" aria-label="Tambah">+</button>

      <button data-value="0" class="wide">0</button>
      <button data-value=".">.</button>
      <button data-action="calculate" class="equals" aria-label="Hitung">=</button>
    </div>

    <footer class="help">ENTER = hitung · ESC = hapus · M = suara</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
