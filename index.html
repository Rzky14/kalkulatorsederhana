<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kalkulator Sederhana</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="calculator">
    <h1>Kalkulator Sederhana</h1>

    <div class="display">
      <input type="text" id="expression" placeholder="0" readonly />
      <div id="result">0</div>
    </div>

    <div class="buttons">
      <button data-action="clear" class="wide">C</button>
      <button data-action="back">⌫</button>
      <button data-value="%">%</button>
      <button data-value="/">÷</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button data-value="*">×</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button data-value="-">−</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button data-value="+">+</button>

      <button data-value="0" class="wide">0</button>
      <button data-value=".">.</button>
      <button data-action="calculate">=</button>
    </div>

    <footer class="help">Klik tombol atau gunakan keyboard. Operator: + − × ÷ %</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
